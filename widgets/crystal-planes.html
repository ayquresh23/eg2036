<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal planes and nanoparticle facets</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  .sim { grid-template-columns:1fr; }
  .stage { min-height:520px; }
  .top { position:absolute; top:12px; left:12px; right:12px; z-index:2; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .top .hud { position:static; }
  .controls { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:2; background:rgba(19,19,24,0.94); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; width:calc(100% - 24px); max-width:760px; }
  .controls input[type=range] { accent-color:var(--accent); cursor:pointer; }
  #timeline { width:180px; }
  #speed { width:80px; }
  .counter { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; font-weight:600; min-width:120px; text-align:center; color:var(--text); }
  .lab { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
  @media (max-width:780px) { .stage { min-height:600px; } }
</style>
<script src="shared.js"></script>
</head>
<body>
<div class="sim sim-root">
  <div class="stage" id="stage">
    <div class="top">
      <div class="seg" role="group" aria-label="Choose a plane">
        <button class="btn active" data-p="100">(100)</button>
        <button class="btn" data-p="110">(110)</button>
        <button class="btn" data-p="111">(111)</button>
      </div>
      <div class="hud" id="hud">
        <div class="hud-label" id="planeName">(100) plane: square face</div>
        <div class="hud-value" id="dens">1.00 atoms / a&sup2;</div>
        <div class="hud-sub" id="note">the densest, flattest cut</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="play">Play assembly</button>
      <input type="range" id="timeline" min="1" max="343" value="343" aria-label="Number of atoms shown">
      <div class="counter" id="counter">Atoms: 343 / 343</div>
      <div class="lab">Speed<input type="range" id="speed" min="1" max="10" value="2"></div>
      <button class="btn" id="size">Size: space filling</button>
      <label style="font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="showPlane" checked> Plane</label>
    </div>
  </div>
</div>

, 1, 0], [0, 5, 0], [0, -4, 0], [1, -4, 0], [5, 0, 0], [-4, 0, 0], [1, -3, -1], [0, -3, -1], [-1, -4, 0], [-2, -2, -1], [-4, -1, 0], [1, 0, -2], [-3, 0, -1], [0, 4, -1], [-3, 1, -1], [1, 1, -2], [0, 1, -2], [4, 0, -1], [0, 0, -2], [2, 1, -2], [-1, -3, -1], [-1, 1, -2], [1, -1, -2], [0, -1, -2], [-1, 0, -2], [-3, -1, -1], [1, 2, -2], [0, 2, -2], [2, 0, -2], [2, -1, -2], [-1, -1, -2], [-1, 2, -2], [1, -2, -2], [0, -2, -2], [0, 3, -2], [-2, 0, -2], [-2, 1, -2], [3, 0, -2], [0, -4, -1], [-1, -2, -2], [0, -5, 0], [-4, 0, -1], [-2, -1, -2], [-5, 0, 0], [0, -3, -2], [-3, 0, -2], [0, 0, -3], [0, 1, -3], [1, 1, -3], [1, 0, -3], [0, -1, -3], [-1, 0, -3], [1, -1, -3], [2, 0, -3], [0, 2, -3], [-1, 1, -3], [-1, -1, -3], [0, -2, -3], [-2, 0, -3], [0, 0, -4], [0, 1, -4], [1, 0, -4], [0, -1, -4], [-1, 0, -4], [0, 0, -5]], color: 0xe9c46a, cam: [8.8, 8.8, 12.9], cell: [0.5, 0.5, 4.5],
             verts: [1,0,4, 0,1,4, 0,0,5], index: [0,1,2],
             name: '(111) plane: triangular slice', dens: '0.58', note: 'clips three corners of the cell' }
  };

  const stage = SimKit.createStage(document.getElementById('stage'), { camPos: P['100'].cam, target: [0, 0, 0], ambient: 0.7 });
  const material = new THREE.MeshPhongMaterial({ color: P['100'].color, shininess: 90 });
  const geometry = new THREE.SphereGeometry(1, 24, 24);
  const dummy = new THREE.Object3D();
  let mesh = null, cur = '100', spaceFilling = true, playing = false, total = 0;

  const cellLines = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: 0xc8c8d4, depthTest: false }));
  cellLines.renderOrder = 2;
  stage.scene.add(cellLines);
  const planeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.7, depthTest: false });
  let planeMesh = null;

  const timeline = document.getElementById('timeline'), counter = document.getElementById('counter');
  const playBtn = document.getElementById('play'), sizeBtn = document.getElementById('size'), speed = document.getElementById('speed');

  function applyTransforms() {
    const r = spaceFilling ? 0.5 : 0.2, a = P[cur].atoms;
    for (let i = 0; i < total; i++) {
      dummy.position.set(a[i][0], a[i][1], a[i][2]); dummy.scale.set(r, r, r); dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  function showCount(n) {
    mesh.count = n; timeline.value = n;
    counter.textContent = 'Atoms: ' + n + ' / ' + total;
  }
  function load(key) {
    playing = false; playBtn.textContent = 'Play assembly';
    cur = key; const d = P[key];
    if (mesh) { stage.scene.remove(mesh); mesh.dispose(); }
    total = d.atoms.length;
    mesh = new THREE.InstancedMesh(geometry, material, total);
    stage.scene.add(mesh);
    material.color.setHex(d.color);
    applyTransforms();
    timeline.max = total; showCount(total);

    cellLines.position.set(d.cell[0], d.cell[1], d.cell[2]);
    if (planeMesh) { stage.scene.remove(planeMesh); planeMesh.geometry.dispose(); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(d.verts), 3));
    g.setIndex(d.index); g.computeVertexNormals();
    planeMat.color.setHex(d.color);
    planeMesh = new THREE.Mesh(g, planeMat);
    planeMesh.renderOrder = 1;
    planeMesh.visible = document.getElementById('showPlane').checked;
    stage.scene.add(planeMesh);

    stage.camera.position.set(d.cam[0], d.cam[1], d.cam[2]);
    stage.controls.target.set(0, 0, 0); stage.controls.update();

    document.getElementById('planeName').textContent = d.name;
    document.getElementById('dens').innerHTML = d.dens + ' atoms / a&sup2;';
    document.getElementById('note').textContent = d.note;
    const hex = '#' + d.color.toString(16).padStart(6, '0');
    document.getElementById('hud').style.setProperty('--hud', hex);
    document.getElementById('dens').style.color = hex;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.p === key));
  }

  SimKit.loop(function () { stage.controls.update(); stage.renderer.render(stage.scene, stage.camera); });

  function step() {
    if (!playing) return;
    const s = parseInt(speed.value, 10), add = s > 7 ? Math.floor(s / 3) : 1;
    const n = Math.min(mesh.count + add, total);
    showCount(n);
    if (n < total) setTimeout(function () { requestAnimationFrame(step); }, 250 / s);
    else { playing = false; playBtn.textContent = 'Play assembly'; }
  }
  playBtn.addEventListener('click', function () {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause assembly' : 'Play assembly';
    if (playing) { if (mesh.count >= total) showCount(1); step(); }
  });
  timeline.addEventListener('input', function () { playing = false; playBtn.textContent = 'Play assembly'; showCount(parseInt(timeline.value, 10)); });
  sizeBtn.addEventListener('click', function () { spaceFilling = !spaceFilling; sizeBtn.textContent = spaceFilling ? 'Size: space filling' : 'Size: small'; applyTransforms(); });
  document.getElementById('showPlane').addEventListener('change', function (e) { if (planeMesh) planeMesh.visible = e.target.checked; });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => load(b.dataset.p)));

  load('100');
})();
